<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Španělština">
<meta name="theme-color" content="#F3F5FA">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Španělský slovník</title>
<style>
:root{--fs:1}
html[data-theme=light]{--bg:#F3F5FA;--surface:#FFFFFF;--surface2:#E8ECF6;--text:#121A33;--muted:#66708C;--border:#DDE2EE;--accent:#2445C7;--accent2:#F2B01E;--good:#1E9E55;--warn:#D99A00;--bad:#D93A3A;--shadow:0 10px 30px rgba(18,26,51,.07)}
html[data-theme=dark]{--bg:#0C1128;--surface:#161D40;--surface2:#212A55;--text:#EEF1FA;--muted:#9AA3C4;--border:#2A3463;--accent:#6F8BFF;--accent2:#F7C548;--good:#3DD27F;--warn:#F5B81C;--bad:#FF6464;--shadow:0 10px 30px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;line-height:1.4;padding-top:env(safe-area-inset-top);padding-bottom:calc(88px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none;touch-action:manipulation}
body.lock{overflow:hidden}
.rd{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:4px 18px 24px}
.view[hidden]{display:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 2px 8px}
h1{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-size:2.1rem;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.15rem;margin:0 0 4px;font-weight:700}
h3{font-size:1.25rem;margin:4px 0 12px;font-weight:800}
.sub{color:var(--muted);font-size:.9rem}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.lbl{font-size:.85rem;font-weight:600;color:var(--muted);margin:16px 0 7px}
.lbl:first-child{margin-top:0}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:650;padding:12px 16px;border-radius:14px;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.big{width:100%;padding:17px;font-size:1.12rem;border-radius:18px;margin-top:18px}
.btn.block{width:100%;margin-top:8px}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:650;font-size:.9rem;padding:9px 4px;border-radius:10px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
input[type=text],input[type=search],textarea,select{width:100%;font:inherit;font-size:max(16px,1rem);padding:12px 14px;border-radius:13px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:140px;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.charbar{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:10px 0}
.charbar button{height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:1.15rem;font-weight:600;padding:0}
.charbar button:active{background:var(--surface2)}
.charbar button.shift.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:5px 0}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:26px;height:26px}
/* home */
.streak{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:7px 13px;font-weight:700;white-space:nowrap}
.goal{display:flex;align-items:center;gap:16px}
.ring{width:78px;height:78px;flex:none}
.ring circle{fill:none;stroke-width:9}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:13px}
.kpi b{font-family:ui-rounded,-apple-system,sans-serif;font-size:1.6rem;display:block;line-height:1.1}
.kpi span{font-size:.78rem;color:var(--muted);font-weight:600}
.srcbtn{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);font-weight:650}
.srcbtn .n{margin-left:auto;color:var(--muted);font-weight:600;font-size:.9rem}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{text-align:left;padding:14px;border-radius:18px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.qbtn b{font-size:.98rem}
.qbtn span{font-size:.8rem;color:var(--muted)}
.wod{background:var(--accent);color:#fff;border:0;position:relative;overflow:hidden}
.wod .w{font-family:ui-rounded,-apple-system,sans-serif;font-size:1.9rem;font-weight:800;margin:4px 0 2px}
.wod .spk{position:absolute;right:14px;bottom:14px;background:rgba(255,255,255,.18);color:#fff;border:0}
.tile{background-image:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--accent2) 85%,transparent) 0 26%,transparent 27%),radial-gradient(circle at 100% 0,transparent 0 38%,rgba(255,255,255,.14) 39% 42%,transparent 43%);background-size:140px 140px;background-repeat:no-repeat;background-position:right top}
.wod.tile{background-color:var(--accent)}
/* practice */
#practice{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 12px);overflow:hidden}
#practice[hidden]{display:none}
.p-top{display:flex;align-items:center;gap:12px;max-width:520px;width:100%;margin:0 auto}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:1.05rem;display:grid;place-items:center;flex:none;padding:0}
.icon-btn:disabled{opacity:.35}
.p-prog{flex:1}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.p-count{font-size:.78rem;color:var(--muted);text-align:center;margin-top:5px;font-weight:600}
.p-score{display:flex;justify-content:center;gap:8px;margin:10px 0 6px}
.pill{padding:5px 12px;border-radius:99px;font-weight:750;font-size:.9rem;background:var(--surface2)}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.p-body{flex:1;display:flex;flex-direction:column;min-height:0;max-width:520px;width:100%;margin:0 auto;overflow-y:auto}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:1400px;min-height:260px;padding:6px 4px}
.deck{position:relative;width:100%;height:100%;max-height:470px}
.peek{position:absolute;inset:0;transform:scale(.93) translateY(16px);background:var(--surface);border:1px solid var(--border);border-radius:30px;opacity:.55}
.fcard{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;cursor:grab;z-index:2}
.fc-inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.fcard.flipped .fc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--border);border-radius:30px;box-shadow:0 18px 44px rgba(18,26,51,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 24px;text-align:center;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face.back::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background-color:var(--accent)}
.face .lang{position:absolute;top:22px;left:0;right:0;font-size:.85rem;font-weight:650;color:var(--muted)}
.word{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-size:2.5rem;font-weight:800;line-height:1.15;word-break:break-word;letter-spacing:-.01em}
.face .orig{margin-top:12px;color:var(--muted);font-size:1.05rem}
.face .note{margin-top:10px;font-size:.9rem;background:var(--surface2);padding:6px 12px;border-radius:10px;color:var(--muted)}
.face .hint{position:absolute;bottom:20px;font-size:.8rem;color:var(--muted)}
.spk{margin-top:18px;width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);font-size:1.25rem;display:grid;place-items:center;padding:0}
.stamp{position:absolute;top:26px;z-index:5;padding:5px 14px;border:3px solid;border-radius:12px;font-weight:900;font-size:1.25rem;opacity:0;pointer-events:none;background:var(--surface)}
.stamp.good{right:20px;color:var(--good);transform:rotate(12deg)}
.stamp.bad{left:20px;color:var(--bad);transform:rotate(-12deg)}
.stamp.unsure{left:50%;top:auto;bottom:40px;transform:translateX(-50%);color:var(--warn)}
.edge{position:fixed;top:0;bottom:0;width:40%;pointer-events:none;opacity:0;z-index:0}
.edge.l{left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 40%,transparent),transparent)}
.edge.r{right:0;background:linear-gradient(-90deg,color-mix(in srgb,var(--good) 40%,transparent),transparent)}
.edge.u{left:0;right:0;width:auto;bottom:auto;height:40%;background:linear-gradient(180deg,color-mix(in srgb,var(--warn) 40%,transparent),transparent)}
.legend{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;margin:14px 8px 10px}
.legend .bad{color:var(--bad)}.legend .warn{color:var(--warn)}.legend .good{color:var(--good)}
.actions{display:flex;justify-content:center;align-items:center;gap:22px;padding-bottom:4px}
.round{width:66px;height:66px;border-radius:50%;border:2.5px solid;background:var(--surface);font-size:1.6rem;font-weight:800;display:grid;place-items:center;padding:0}
.round:active{transform:scale(.92)}
.round.sm{width:52px;height:52px;font-size:1.25rem}
.round.good{color:var(--good);border-color:var(--good)}
.round.bad{color:var(--bad);border-color:var(--bad)}
.round.warn{color:var(--warn);border-color:var(--warn)}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:42px 20px 22px;text-align:center;position:relative;margin-top:6px;box-shadow:var(--shadow)}
.tcard .lang{position:absolute;top:16px;left:0;right:0;font-size:.85rem;font-weight:650;color:var(--muted)}
.tcard .word{font-size:2.1rem}
.tcard .spk{margin:12px auto 0}
.ans{font-size:max(18px,1.3rem)!important;text-align:center;padding:15px!important;border-width:2.5px!important;margin-top:16px;transition:background .2s,border-color .2s}
.ans.ok{border-color:var(--good)!important;background:color-mix(in srgb,var(--good) 16%,var(--surface))!important}
.ans.almost{border-color:var(--warn)!important;background:color-mix(in srgb,var(--warn) 20%,var(--surface))!important}
.ans.wrong{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 15%,var(--surface))!important}
.fb{text-align:center;margin:4px 0 8px;font-size:1rem;min-height:1.4em}
.fb .v{font-weight:800;font-size:1.15rem;display:block;margin-bottom:2px}
.fb .v.good{color:var(--good)}.fb .v.warn{color:var(--warn)}.fb .v.bad{color:var(--bad)}
mark{background:color-mix(in srgb,var(--warn) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.t-actions{display:flex;gap:10px;margin-top:4px}
.t-actions .btn{flex:1}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{padding:16px 18px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);font-size:1.1rem;font-weight:650;text-align:left}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.opt:disabled{opacity:1}
.result{text-align:center;padding-top:20px}
.result .big{font-size:3.4rem}
.res-list{text-align:left;margin-top:14px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:60}
#sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,10,30,.45);opacity:0;transition:opacity .25s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
#sheet.open .scrim{opacity:1}
#sheet.open .sheet-panel{transform:none}
.sheet-head{position:sticky;top:-8px;z-index:3;margin:-8px -18px 4px;padding:10px 18px 6px;background:var(--bg);touch-action:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--muted);opacity:.45;margin:2px auto 6px}
.sheet-x{position:absolute;right:14px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);font-size:.95rem;font-weight:700;display:grid;place-items:center;padding:0}
.sheet-panel{overscroll-behavior:contain}
.opt-list{display:flex;flex-direction:column;gap:6px}
.opt-list button{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);text-align:left;font-weight:600}
.opt-list button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt-list .n{margin-left:auto;color:var(--muted);font-size:.88rem}
.gtitle{font-size:.85rem;font-weight:700;color:var(--muted);margin:16px 4px 8px}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:650;font-size:.92rem;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
/* dictionary */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 10px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);padding:8px 13px;border-radius:99px;font-size:.88rem;font-weight:650;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 10px;font-size:.88rem;color:var(--muted)}
.toolbar select{width:auto;padding:6px 10px;font-size:max(16px,.88rem);border-radius:10px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 4px}
.wlist{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.wrow:last-child{border-bottom:0}
.wt{flex:1;min-width:0}
.wt b{display:block;font-size:1.02rem;font-weight:650}
.wt span{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--border)}
.dot.known{background:var(--good)}.dot.unsure{background:var(--warn)}.dot.weak{background:var(--bad)}
.star{background:none;border:0;font-size:1.3rem;color:var(--border);padding:2px 4px;line-height:1}
.star.on{color:var(--accent2)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex:none;display:grid;place-items:center;font-size:.8rem;color:#fff}
.wrow.picked .chk{background:var(--accent);border-color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:2rem;line-height:1;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 45%,transparent);z-index:15;padding:0}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);border-radius:18px;padding:8px 10px;display:flex;gap:2px;align-items:center;z-index:16;max-width:620px;margin:0 auto}
.selbar b{flex:1;padding-left:6px;font-size:.9rem}
.selbar button{background:none;border:0;color:inherit;font-weight:700;font-size:.88rem;padding:8px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.lcard{display:flex;align-items:center;gap:12px;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:20px;margin-bottom:10px}
.lemoji{font-size:1.5rem;width:46px;height:46px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;flex:none}
.lbody{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.lname{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lmeta{font-size:.8rem;color:var(--muted);margin:1px 0 7px;display:block}
.mbar{display:flex;height:6px;border-radius:9px;overflow:hidden;background:var(--surface2)}
.mbar i{display:block;height:100%}
.lplay{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:.95rem;flex:none;padding:0}
.lmore{width:36px;height:40px;border:0;background:none;font-size:1.3rem;color:var(--muted);flex:none;padding:0}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchips button{border:1px solid var(--border);background:var(--surface);padding:7px 11px;border-radius:99px;font-size:.85rem;font-weight:600}
.lchips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wstats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart{display:flex;align-items:stretch;gap:5px;height:140px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.colbar{flex:1;display:flex;align-items:flex-end}
.stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;min-height:3px;background:var(--surface2)}
.col small{text-align:center;font-size:.66rem;color:var(--muted);margin-top:5px}
.col.today small{color:var(--accent);font-weight:800}
.bigbar{display:flex;height:14px;border-radius:9px;overflow:hidden;margin:12px 0 10px;background:var(--surface2)}
.legend2{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend2 span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
details.grp{background:var(--surface);border:1px solid var(--border);border-radius:20px;margin-bottom:10px;overflow:hidden}
details.grp summary{list-style:none;padding:15px 16px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .n{margin-left:auto;color:var(--muted);font-weight:600}
details.grp summary::after{content:"›";font-size:1.3rem;color:var(--muted);transition:transform .2s}
details.grp[open] summary::after{transform:rotate(90deg)}
.grp-body{padding:0 16px 14px}
.mini{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:.92rem}
.mini span:last-child{color:var(--muted);text-align:right}
.sess{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--border);font-size:.9rem}
/* settings */
.set-group{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:6px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-row.col{flex-direction:column;align-items:stretch}
.set-row .t{font-weight:650}
.set-row .d{font-size:.8rem;color:var(--muted);margin-top:2px}
.set-title{font-size:.85rem;font-weight:700;color:var(--muted);margin:22px 6px 8px}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;z-index:1;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--surface2);border-radius:99px;transition:.2s;border:1px solid var(--border)}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+i{background:var(--good);border-color:var(--good)}
.switch input:checked+i::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent)}
.set-btn{width:100%;text-align:left;background:none;border:0;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:650}
.set-btn:last-child{border-bottom:0}
.set-btn.danger{color:var(--bad)}
.howto{font-size:.9rem;color:var(--muted);padding:0 16px 14px}
.howto ol{padding-left:20px;margin:6px 0}
/* gramatika */
#lesson{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 6px)}
.l-top{display:flex;align-items:center;gap:12px;padding:6px 16px 8px;max-width:680px;width:100%;margin:0 auto}
.l-title{font-weight:800;font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 28px}
.l-foot{padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface)}
.l-foot .btn{max-width:640px;margin:0 auto;display:flex}
.g{max-width:640px;margin:0 auto;line-height:1.55}
.g h4{font-size:1.12rem;margin:24px 0 8px}
.g p{margin:8px 0}
.g .lead{font-size:1.05rem;color:var(--muted);margin-top:12px}
.g ul{padding-left:20px;margin:8px 0}.g li{margin:6px 0}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
.gt{width:100%;border-collapse:collapse;font-size:.95rem}
.gt th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:700;background:var(--surface2);font-size:.85rem;white-space:nowrap}
.gt td{padding:9px 12px;border-top:1px solid var(--border)}
.gt td:first-child{color:var(--muted)}
.gt td b,.g li b,.g p b{color:var(--accent)}
.gex{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2px 14px;margin:10px 0}
.gex div{padding:9px 0;border-top:1px solid var(--border)}.gex div:first-child{border-top:0}
.gex b{display:block;font-weight:700}.gex span{color:var(--muted);font-size:.92rem}
.tip{background:color-mix(in srgb,var(--accent2) 20%,var(--surface));border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.95rem}
.tip b{color:inherit!important}
.gl{width:100%;display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:20px;margin-bottom:10px;text-align:left}
.lbody2{flex:1;min-width:0}.lbody2 b{display:block}.lbody2 span{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font-size:.8rem;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.badge.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.gqt{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-size:1.5rem;font-weight:700;line-height:1.4}
.blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--accent);margin:0 4px;vertical-align:-3px}
.gperson{margin-top:14px;display:inline-block;background:var(--accent);color:#fff;font-weight:750;padding:6px 16px;border-radius:99px}
.gnote{margin-top:10px;font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center}
.gnote .hl{color:var(--accent)}.gnote .hl b{text-decoration:underline}
.gvoc{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin:0 0 10px;border-radius:16px;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:var(--accent);font-weight:700}
#view-gram details.grp .gl{margin-bottom:8px;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    txt.trim().split('\n').forEach(line=>{
      const [es,cz,note]=line.split('|'); if(!es||!cz) return;
      const k=es.trim().toLowerCase();
      if(byEs.has(k)){const w=byEs.get(k); if(!w.lists.includes(lid)) w.lists.push(lid); return;}
      const w=newWord(es,cz,note,[lid]); words.push(w); byEs.set(k,w);
    });
  }
  for(const [id,emoji,name,txt] of BOOK) addSeedList(lists,words,byEs,'k-'+id,emoji,name,txt,true);
  return{lists,words};
}
function addSeedList(lists,words,byEs,lid,emoji,name,txt,book){
  lists.push({id:lid,name,emoji,builtin:true,book:!!book});
  txt.trim().split('\n').forEach(line=>{
    const [es,cz,note]=line.split('|'); if(!es||!cz) return;
    const k=es.trim().toLowerCase();
    if(byEs.has(k)){const w=byEs.get(k); if(!w.lists.includes(lid)) w.lists.push(lid); return;}
    const w=newWord(es,cz,note,[lid]); words.push(w); byEs.set(k,w);
  });
}
function mergeBook(){
  const byEs=new Map();D.words.forEach(w=>{const k=w.es.trim().toLowerCase();if(!byEs.has(k))byEs.set(k,w)});
  const lists=[],words=[];
  for(const [id,emoji,name,txt] of BOOK){if(listById('k-'+id))continue;addSeedList(lists,words,byEs,'k-'+id,emoji,name,txt,true)}
  D.lists.push(...lists);D.words.push(...words);return words.length;
}

function status(w){
  const n=w.c+w.a+w.w; if(!n) return 'new';
  const acc=(w.c+.5*w.a)/n;
  if(w.last==='w'||acc<.5) return 'weak';
  if(n>=2&&acc>=.8&&w.last==='c') return 'known';
  return 'unsure';
}

function countStatus(ws){const r={known:0,unsure:0,weak:0,new:0};ws.forEach(w=>r[status(w)]++);return r}
function streak(){

  if(!has(dkey(d))) d.setDate(d.getDate()-1);

}

const ART=/^(el|la|los|las|un|una|unos|unas|lo)\s+/;
const norm=s=>(s||'').toLowerCase().normalize('NFC').replace(/[¿¡!?.,;:"'«»()]/g,' ').replace(/\s+/g,' ').trim();
const variants=ans=>ans.split(/[,;\/]/).map(x=>x.replace(/\([^)]*\)/g,'')).map(norm).filter(Boolean);
function levMarks(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const marks=new Array(n).fill(false);let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){if(a[i-1]!==b[j-1])marks[j-1]=true;i--;j--}
    else if(j>0&&dp[i][j]===dp[i][j-1]+1){marks[j-1]=true;j--}
    else{if(j>0)marks[j-1]=true;else if(n>0)marks[0]=true;i--}
  }
  return{d:dp[m][n],marks};
}
function grade(input,answer,go={}){
  const st=D.settings,u=norm(input),ign=go.articles===false?false:st.ignoreArticles;
  const ts=new Set([...variants(answer),norm(answer.replace(/\([^)]*\)/g,''))]);
  if(!u) return{res:'w',d:99,target:[...ts][0]||'',user:''};
  const us=new Set([u]);
  if(ign){[...us].forEach(x=>us.add(x.replace(ART,'')));[...ts].forEach(x=>ts.add(x.replace(ART,'')))}
  let best={d:99,t:'',u:''};
  for(const t of ts)for(const x of us){const d=st.tolerant?levMarks(fold(x),fold(t)).d:levMarks(x,t).d;if(d<best.d)best={d,t,u:x}}
  const len=best.t.length;let res='w';
  if(best.d===0)res='c';else if((best.d===1&&len>=2)||(best.d===2&&len>=5))res='a';
  return{res,d:best.d,target:best.t,user:best.u};
}
function diffHTML(user,target){const{marks}=levMarks(user,target);return [...target].map((ch,i)=>marks[i]?`<mark>${esc(ch)}</mark>`:esc(ch)).join('')}

function sources(){
  const smart=[['all','📚','Všechna slovíčka'],['due','🔁','K opakování dnes'],['problem','⚠️','Neumím + nejistá'],['weak','❌','Neumím'],['unsure','🤔','Nejistá'],['new','🆕','Nová (neprocvičená)'],['star','⭐','Oblíbená']].map(([id,emoji,label])=>({id,emoji,label}));
  const lists=D.lists.map(l=>({id:'list:'+l.id,emoji:l.emoji||'📁',label:l.name,builtin:l.builtin,book:l.book}));
  return{smart,lists};
}
function srcInfo(id){const s=sources();return [...s.smart,...s.lists].find(x=>x.id===id)||s.smart[0]}
function poolFor(src){
  const W=D.words;
  if(src.startsWith('list:')){const id=src.slice(5);return W.filter(w=>w.lists.includes(id))}
  switch(src){
    case 'due':return W.filter(isDue);
    case 'problem':return W.filter(w=>['weak','unsure'].includes(status(w)));
    case 'weak':return W.filter(w=>status(w)==='weak');
    case 'unsure':return W.filter(w=>status(w)==='unsure');
    case 'new':return W.filter(w=>status(w)==='new');
    case 'star':return W.filter(w=>w.star);
    default:return W;
  }
}
function pickWords(pool,len){
  const n=len>0?Math.min(len,pool.length):pool.length;
  if(!D.settings.smart) return shuffle(pool).slice(0,n);
  const now=Date.now();
  const scored=pool.map(w=>{const tot=w.c+w.a+w.w,st=status(w);let p=(5-w.box)*2;if(!tot)p+=3;if(tot&&w.due<=now)p+=4;if(st==='weak')p+=5;if(st==='unsure')p+=2;return{w,p:p+Math.random()*5}});
  scored.sort((a,b)=>b.p-a.p);
  return shuffle(scored.slice(0,n).map(x=>x.w));
}

let S=null;

function startSession(o={}){
  const s=D.settings,src=o.src||s.source,mode=o.mode||s.mode,dir=o.dir||s.dir,len=o.len??s.len;
  const pool=o.words||poolFor(src);
  if(!pool.length) return toast(src==='due'?'Dnes nic k opakování nečeká 👌':'V tomto výběru nejsou žádná slovíčka');
  if(mode==='choice'&&D.words.length<4) return toast('Pro výběr ze 4 potřebuješ aspoň 4 slovíčka');
  const words=pickWords(pool,len);
  S={mode,src,dir,items:words.map(w=>({w,dir:dir==='mix'?(Math.random()<.5?'es-cz':'cz-es'):dir})),i:0,cnt:{c:0,a:0,w:0},results:[],undo:null,busy:false,t:Date.now(),retry:!!o.words};
  $('#practice').hidden=false; document.body.classList.add('lock');

}
function updateScore(){if(!S)return;$('#scC').textContent=S.cnt.c;$('#scA').textContent=S.cnt.a;$('#scW').textContent=S.cnt.w;$('#pUndo').disabled=!S.undo||S.mode!=='cards'}
function record(item,res){
  const w=item.w;
  S.undo={item,res,idx:S.i,snap:w?{c:w.c,a:w.a,w:w.w,box:w.box,due:w.due,recent:[...w.recent],last:w.last}:null};
  if(w){
    w[res]++; w.recent=[...w.recent,res].slice(-6); w.last=res;
    w.box=res==='c'?Math.min(5,w.box+1):res==='w'?0:Math.max(0,w.box-1);
    w.due=Date.now()+INTERVALS[w.box]*864e5;
  }
  const k=dkey(); (D.days[k]||(D.days[k]={c:0,a:0,w:0}))[res]++;
  S.cnt[res]++; S.results.push({w,item,res,dir:item.dir,given:item.given||''});
  save(); updateScore();
}
function unrecord(){
  if(!S||!S.undo) return null;
  const{item,res,idx,snap}=S.undo; if(item.w)Object.assign(item.w,snap);
  const d=D.days[dkey()]; if(d&&d[res]>0)d[res]--;
  S.cnt[res]--; S.results.pop(); S.undo=null; save(); updateScore(); return idx;
}

  const w=item.w,hasNext=S.i<S.items.length-1;
  $('#pBody').innerHTML=`
  <div class="edge l" id="edL"></div><div class="edge r" id="edR"></div><div class="edge u" id="edU"></div>
  <div class="stage"><div class="deck">
    ${hasNext?'<div class="peek"></div>':''}
    <div class="fcard" id="fc">
      <div class="stamp bad" id="stW">✗ ŠPATNĚ</div><div class="stamp good" id="stC">✓ SPRÁVNĚ</div><div class="stamp unsure" id="stA">? NEJISTÉ</div>
      <div class="fc-inner">
        <div class="face front"><div class="lang">${lbl(item.pl)}</div><div class="word">${esc(item.prompt)}</div>${item.pl==='es'?'<button class="spk nodrag" data-say="es">🔊</button>':''}<div class="hint">Klepnutím otočíš</div></div>
        <div class="face back"><div class="lang">${lbl(item.al)}</div><div class="word">${esc(item.answer)}</div><div class="orig">${esc(item.prompt)}</div>${w.note?`<div class="note">${esc(w.note)}</div>`:''}<button class="spk nodrag" data-say="es">🔊</button></div>
      </div>
    </div>
  </div></div>
  <div class="legend"><span class="bad">← Špatně</span><span class="warn">↑ Nejisté</span><span class="good">Správně →</span></div>
  <div class="actions"><button class="round bad" data-r="w" aria-label="Špatně">✗</button><button class="round warn sm" data-r="a" aria-label="Nejisté">?</button><button class="round good" data-r="c" aria-label="Správně">✓</button></div>`;
  const fc=$('#fc');
  $$('[data-say]',fc).forEach(b=>{b.addEventListener('pointerdown',e=>e.stopPropagation());b.onclick=e=>{e.stopPropagation();speak(w.es)}});
  $$('.actions [data-r]').forEach(b=>b.onclick=()=>fly(b.dataset.r));
  bindDrag(fc);
  if(D.settings.autoSpeak&&item.pl==='es') speak(w.es);
}
function flip(){const fc=$('#fc');if(!fc)return;fc.classList.toggle('flipped');const it=S.items[S.i];if(fc.classList.contains('flipped')&&D.settings.autoSpeak&&it.al==='es')speak(it.w.es)}
function setDragFx(dx,dy){
  const T=110,r=Math.max(0,Math.min(1,dx/T)),l=Math.max(0,Math.min(1,-dx/T)),u=(-dy>Math.abs(dx))?Math.max(0,Math.min(1,-dy/T)):0;
  $('#stC').style.opacity=r;$('#stW').style.opacity=l;$('#stA').style.opacity=u;
  $('#edR').style.opacity=r;$('#edL').style.opacity=l;$('#edU').style.opacity=u;
}
function bindDrag(fc){
  let sx=0,sy=0,dx=0,dy=0,down=false,pid=null;
  fc.addEventListener('pointerdown',e=>{if(S.busy||e.target.closest('.nodrag'))return;down=true;pid=e.pointerId;try{fc.setPointerCapture(pid)}catch(_){}sx=e.clientX;sy=e.clientY;dx=dy=0;fc.style.transition='none'});
  fc.addEventListener('pointermove',e=>{if(!down||e.pointerId!==pid)return;dx=e.clientX-sx;dy=e.clientY-sy;fc.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;setDragFx(dx,dy)});
  const end=()=>{
    if(!down)return;down=false;fc.style.transition='';
    const T=100;
    if(Math.abs(dx)<8&&Math.abs(dy)<8){fc.style.transform='';setDragFx(0,0);flip();return}
    if(dx>T&&Math.abs(dx)>=-dy)fly('c',dx,dy);
    else if(dx<-T&&Math.abs(dx)>=-dy)fly('w',dx,dy);
    else if(-dy>T&&-dy>Math.abs(dx))fly('a',dx,dy);
    else{fc.style.transform='';setDragFx(0,0)}
  };
  fc.addEventListener('pointerup',end);
  fc.addEventListener('pointercancel',()=>{down=false;fc.style.transition='';fc.style.transform='';setDragFx(0,0)});
}
function fly(res,dx=0,dy=0){
  if(S.busy)return;S.busy=true;
  const fc=$('#fc'),W=innerWidth*1.3;
  setDragFx(res==='c'?200:res==='w'?-200:0,res==='a'?-200:0);
  const x=res==='c'?W:res==='w'?-W:dx,y=res==='a'?-innerHeight:dy;
  fc.style.transition='transform .38s ease-in,opacity .38s';
  fc.style.transform=`translate(${x}px,${y}px) rotate(${x/22}deg)`;fc.style.opacity='0';
  record(S.items[S.i],res);
  setTimeout(()=>{if(!S)return;S.i++;renderItem()},300);
}

  typingUI(item,{card:`<div class="tcard"><div class="lang">${lbl(item.pl)}</div><div class="word">${esc(item.prompt)}</div>${item.pl==='es'?'<button class="spk" id="tSpk" aria-label="Přehrát">🔊</button>':''}</div>`,
    answer:item.answer,placeholder:`Napiš ${item.al==='es'?'španělsky':'česky'}…`,say:item.w.es});

function typingUI(item,o){
  $('#pBody').innerHTML=`${o.card}
  <input id="ans" class="ans" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="${esc(o.placeholder)}">
  ${charbarHTML()}
  <div class="fb" id="fb"></div>
  <div class="t-actions"><button class="btn" id="dunno">Nevím</button><button class="btn primary" id="check">Zkontrolovat</button></div>
  <button class="btn ghost block" id="accept" hidden>Uznat jako správně</button>`;
  const inp=$('#ans'),chk=$('#check'),dn=$('#dunno'),acc=$('#accept');let done=false,g=null;
  const note=o.note?`<div class="gnote">${o.note}</div>`:'';
  bindCharbar($('#pBody'),()=>inp);
  [chk,dn,acc].forEach(keepFocus);
  if($('#tSpk')){keepFocus($('#tSpk'));$('#tSpk').onclick=()=>speak(o.say)}
  const next=()=>{S.i++;renderItem()};
  const show=()=>{
    const fb=$('#fb'),ans=esc(o.answer);
    inp.classList.remove('ok','almost','wrong');
    if(g.res==='c'){inp.classList.add('ok');fb.innerHTML=`<span class="v good">✓ Správně!</span>${o.answer!==inp.value.trim()?`<span class="sub">${ans}</span>`:''}${note}`}
    else if(g.res==='a'){inp.classList.add('almost');fb.innerHTML=`<span class="v warn">≈ Skoro! Překlep v ${g.d} ${plural(g.d,'znaku','znacích','znacích')}</span>Správně: <b>${diffHTML(g.user,g.target)}</b>${variants(o.answer).length>1?`<div class="sub">${ans}</div>`:''}${note}`}
    else{inp.classList.add('wrong');fb.innerHTML=`<span class="v bad">✗ ${inp.value.trim()?'Špatně':'Nevadí, příště'}</span>Správně: <b>${ans}</b>${note}`}
    chk.textContent='Další'; dn.hidden=true; acc.hidden=g.res==='c';
    if(o.say&&D.settings.autoSpeak) speak(o.say);
  };
  const check=()=>{if(done)return next();done=true;item.given=inp.value;g=grade(inp.value,o.answer,o.gopts);record(item,g.res);show()};
  chk.onclick=check;
  dn.onclick=()=>{if(done)return;inp.value='';check()};
  acc.onclick=()=>{unrecord();record(item,'c');g={...g,res:'c'};acc.hidden=true;inp.classList.remove('almost','wrong');inp.classList.add('ok');$('#fb').innerHTML=`<span class="v good">✓ Uznáno</span><span class="sub">${esc(o.answer)}</span>${note}`};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
  inp.focus();
}

/* --- výběr ze 4 --- */
function renderChoice(item){
  const w=item.w,f=item.al==='es'?'es':'cz';
  const cand=D.words.filter(x=>x.id!==w.id&&norm(x[f])!==norm(w[f]));
  const same=cand.filter(x=>x.lists.some(l=>w.lists.includes(l)));
  const src=same.length>=3?same:cand;
  const opts=shuffle([w,...shuffle(src).slice(0,3)]);
  $('#pBody').innerHTML=`
  <div class="tcard"><div class="lang">${lbl(item.pl)}</div><div class="word">${esc(item.prompt)}</div>${item.pl==='es'?'<button class="spk" id="tSpk">🔊</button>':''}</div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(o[f])}</button>`).join('')}</div>
  <div class="fb" id="fb" style="margin-top:12px"></div>
  <button class="btn primary block" id="cNext" hidden>Další</button>`;
  if($('#tSpk'))$('#tSpk').onclick=()=>speak(w.es);
  if(D.settings.autoSpeak&&item.pl==='es')speak(w.es);
  const next=()=>{S.i++;renderItem()};
  $$('.opt').forEach(b=>b.onclick=()=>{
    if(S.busy)return;S.busy=true;
    const ok=b.dataset.id===w.id;
    $$('.opt').forEach(x=>{x.disabled=true;if(x.dataset.id===w.id)x.classList.add('good')});
    if(!ok)b.classList.add('bad');
    item.given=b.textContent; record(item,ok?'c':'w');
    if(ok){setTimeout(()=>{if(S&&S.items[S.i]===item)next()},750)}
    else{$('#fb').innerHTML=`<span class="v bad">✗ Správně je: ${esc(item.answer)}</span>`;$('#cNext').hidden=false;$('#cNext').onclick=next}
  });
}

/* --- konec session --- */
function finish(){
  const{c,a,w}=S.cnt,tot=c+a+w,pct=tot?Math.round((c+.5*a)/tot*100):0,isG=S.mode==='gram';
  if(!S.saved&&tot) saveSession();
  if(isG&&S.lid&&!S.retry&&!S.progSaved){S.progSaved=true;const g=D.gram[S.lid]||{best:0,n:0};g.best=Math.max(g.best,pct);g.last=pct;g.n++;D.gram[S.lid]=g;save()}
  S.undo=null; updateScore();
  const miss=[],seen=new Set();
  S.results.filter(r=>r.res!=='c').forEach(r=>{const k=r.w?r.w.id:r.item.key;if(!seen.has(k)){seen.add(k);miss.push(r)}});
  const emoji=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  const msg=pct>=90?'¡Excelente!':pct>=70?'¡Muy bien!':pct>=50?'Dobrá práce':'Opakování dělá mistra';
  const row=r=>isG?`<div class="mini"><span><span class="dot ${r.res==='a'?'unsure':'weak'}" style="display:inline-block;margin-right:8px"></span>${esc(r.item.plain)}</span><span><b style="color:var(--text)">${esc(r.item.a)}</b></span></div>`
    :`<div class="mini"><span><span class="dot ${r.res==='a'?'unsure':'weak'}" style="display:inline-block;margin-right:8px"></span><b>${esc(r.w.es)}</b></span><span>${esc(r.w.cz)}</span></div>`;
  $('#pBody').innerHTML=`<div class="result">
    <div class="big">${emoji}</div><h1 style="font-size:1.9rem;margin:6px 0 2px">${msg}</h1>
    <div class="sub">Úspěšnost ${pct} % z ${tot} ${isG?plural(tot,'cvičení','cvičení','cvičení'):plural(tot,'slovíčka','slovíček','slovíček')}</div>
    <div class="p-score" style="margin:16px 0"><span class="pill good">✓ ${c} správně</span><span class="pill warn">≈ ${a}</span><span class="pill bad">✗ ${w} špatně</span></div>
    ${miss.length?`<div class="card res-list"><h2>K zopakování</h2>${miss.map(row).join('')}</div>`:''}
    ${miss.length?`<button class="btn primary big" id="rMiss">Procvičit chyby (${miss.length})</button>`:''}
    <button class="btn block" id="rAgain" style="margin-top:10px">Nové kolo</button>
    <button class="btn ghost block" id="rDone">Hotovo</button>
  </div>`;
  const mode=S.mode,src=S.src,dir=S.dir,regen=S.regen,label=S.label;
  if(miss.length)$('#rMiss').onclick=()=>isG?startGram(miss.map(r=>r.item),{src,label,regen,retry:true}):startSession({words:miss.map(r=>r.w),len:0,mode,dir,src});
  $('#rAgain').onclick=()=>isG?regen():startSession({src,mode,dir});
  $('#rDone').onclick=closePractice;
}
document.addEventListener('keydown',e=>{
  if(!S||$('#practice').hidden||!$('#sheet').hidden)return;
  if(S.mode==='cards'&&$('#fc')){
    if(e.key==='ArrowRight')fly('c');else if(e.key==='ArrowLeft')fly('w');else if(e.key==='ArrowUp')fly('a');else if(e.key===' '){e.preventDefault();flip()}
  }
  if(e.key==='Escape')closePractice();
});

/* ===================== SLOVNÍK ===================== */
const dict={tab:'words',filter:'all',q:'',sort:'az',sel:false,picked:new Set(),limit:150};
const sortKey=s=>fold(s.replace(/^[¿¡]/,'').replace(ART,''));
function filteredWords(){
  let ws=D.words;const f=dict.filter;
  if(f==='star')ws=ws.filter(w=>w.star);
  else if(f==='none')ws=ws.filter(w=>!w.lists.length);
  else if(f.startsWith('st:'))ws=ws.filter(w=>status(w)===f.slice(3));
  else if(f.startsWith('l:'))ws=ws.filter(w=>w.lists.includes(f.slice(2)));
  if(dict.q){const q=fold(dict.q.trim());ws=ws.filter(w=>fold(w.es).includes(q)||fold(w.cz).includes(q))}
  const acc=w=>{const n=w.c+w.a+w.w;return n?(w.c+.5*w.a)/n:2};
  if(dict.sort==='az')ws=[...ws].sort((a,b)=>sortKey(a.es).localeCompare(sortKey(b.es),'es'));
  else if(dict.sort==='cz')ws=[...ws].sort((a,b)=>a.cz.localeCompare(b.cz,'cs'));
  else if(dict.sort==='worst')ws=[...ws].sort((a,b)=>acc(a)-acc(b)||b.w-a.w);
  else if(dict.sort==='new')ws=[...ws].sort((a,b)=>b.t-a.t);
  return ws;
}
function renderDict(){
  const v=$('#view-dict');
  if(dict.filter.startsWith('l:')&&!listById(dict.filter.slice(2)))dict.filter='all';
  v.innerHTML=`<header class="top"><h1>Slovník</h1></header>
  <div class="seg" id="dictSeg" style="margin-bottom:12px"><button data-t="words" class="${dict.tab==='words'?'on':''}">Slovíčka</button><button data-t="lists" class="${dict.tab==='lists'?'on':''}">Seznamy</button></div>
  <div id="dictBody"></div>`;
  $$('#dictSeg button').forEach(b=>b.onclick=()=>{dict.tab=b.dataset.t;dict.sel=false;dict.picked.clear();renderDict()});
  dict.tab==='words'?renderWordsTab():renderListsTab();
}
function renderWordsTab(){
  const chips=[['all','Vše'],['star','⭐ Oblíbená'],['st:weak','❌ Neumím'],['st:unsure','🤔 Nejistá'],['st:known','✅ Umím'],['st:new','🆕 Nová'],...D.lists.filter(l=>!l.builtin).map(l=>['l:'+l.id,(l.emoji||'📁')+' '+l.name]),...D.lists.filter(l=>l.book).map(l=>['l:'+l.id,(l.emoji||'📁')+' '+l.name.split(' · ')[0]]),...D.lists.filter(l=>l.builtin&&!l.book).map(l=>['l:'+l.id,(l.emoji||'📁')+' '+l.name])];
  $('#dictBody').innerHTML=`
  <input type="search" id="q" placeholder="Hledat španělsky nebo česky" value="${esc(dict.q)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div class="chips" id="chips" style="margin-top:10px">${chips.map(([id,l])=>`<button class="chip ${dict.filter===id?'on':''}" data-f="${id}">${esc(l)}</button>`).join('')}</div>
  <div class="toolbar"><span id="wcount"></span><span style="display:flex;gap:6px;align-items:center">
    <select id="sort" aria-label="Řazení"><option value="az">A–Z 🇪🇸</option><option value="cz">A–Z 🇨🇿</option><option value="worst">Nejhorší</option><option value="new">Nejnovější</option></select>
    <button class="linkbtn" id="selBtn">${dict.sel?'Zrušit':'Vybrat'}</button></span></div>
  <div id="wlist"></div>
  ${dict.sel?'':'<button class="fab" id="fab" aria-label="Přidat slovíčko">+</button>'}
  <div id="selbarWrap"></div>`;
  $('#sort').value=dict.sort;
  $('#sort').onchange=e=>{dict.sort=e.target.value;renderWordList()};
  $('#q').oninput=e=>{dict.q=e.target.value;dict.limit=150;renderWordList()};
  $$('#chips .chip').forEach(b=>b.onclick=()=>{dict.filter=b.dataset.f;dict.limit=150;$$('#chips .chip').forEach(x=>x.classList.toggle('on',x===b));renderWordList()});
  $('#selBtn').onclick=()=>{dict.sel=!dict.sel;dict.picked.clear();renderWordsTab()};
  if($('#fab'))$('#fab').onclick=()=>addSheet();
  renderWordList();
}
function renderWordList(){
  const ws=filteredWords(),box=$('#wlist');if(!box)return;
  $('#wcount').textContent=`${ws.length} ${plural(ws.length,'slovíčko','slovíčka','slovíček')}`;
  if(!ws.length){box.innerHTML=`<div class="empty">${dict.q?'Nic nenalezeno. Zkus jiné slovo nebo ho přidej tlačítkem +.':'Tady zatím nic není.'}</div>`;renderSelbar();return}
  const shown=ws.slice(0,dict.limit);
  box.innerHTML=`<div class="wlist">${shown.map(w=>`<div class="wrow ${dict.picked.has(w.id)?'picked':''}" data-id="${w.id}">${dict.sel?'<span class="chk">✓</span>':`<span class="dot ${status(w)}"></span>`}<div class="wt"><b>${esc(w.es)}</b><span>${esc(w.cz)}</span></div>${dict.sel?'':`<button class="star ${w.star?'on':''}" data-star="${w.id}" aria-label="Oblíbené">★</button>`}</div>`).join('')}</div>
  ${ws.length>dict.limit?`<button class="btn block" id="more">Zobrazit další (${ws.length-dict.limit})</button>`:''}`;
  $$('.wrow',box).forEach(r=>r.onclick=e=>{
    const id=r.dataset.id;
    if(e.target.closest('[data-star]')){const w=D.words.find(x=>x.id===id);w.star=!w.star;save();e.target.classList.toggle('on',w.star);return}
    if(dict.sel){dict.picked.has(id)?dict.picked.delete(id):dict.picked.add(id);r.classList.toggle('picked');renderSelbar();return}
    editSheet(id);
  });
  if($('#more'))$('#more').onclick=()=>{dict.limit+=300;renderWordList()};
  renderSelbar();
}
function renderSelbar(){
  const wrap=$('#selbarWrap');if(!wrap)return;
  if(!dict.sel){wrap.innerHTML='';return}
  const n=dict.picked.size,inList=dict.filter.startsWith('l:');
  wrap.innerHTML=`<div class="selbar"><b>${n} vybráno</b><button id="sAll">Vše</button><button id="sList" ${n?'':'disabled'}>Do seznamu</button>${inList?`<button id="sRem" ${n?'':'disabled'}>Odebrat</button>`:''}<button id="sPlay" ${n?'':'disabled'}>▶</button><button id="sDel" ${n?'':'disabled'}>🗑</button></div>`;
  $('#sAll').onclick=()=>{const ws=filteredWords();if(dict.picked.size===ws.length)dict.picked.clear();else ws.forEach(w=>dict.picked.add(w.id));renderWordList()};
  $('#sList').onclick=()=>pickListSheet([...dict.picked]);
  $('#sPlay').onclick=()=>startSession({words:D.words.filter(w=>dict.picked.has(w.id)),len:0});
  $('#sDel').onclick=()=>{if(!confirm(`Opravdu smazat ${n} ${plural(n,'slovíčko','slovíčka','slovíček')}?`))return;D.words=D.words.filter(w=>!dict.picked.has(w.id));dict.picked.clear();save();toast('Smazáno');renderWordList()};
  if(inList)$('#sRem').onclick=()=>{const lid=dict.filter.slice(2);D.words.forEach(w=>{if(dict.picked.has(w.id))w.lists=w.lists.filter(x=>x!==lid)});dict.picked.clear();save();toast('Odebráno ze seznamu');renderWordList()};
}
function pickListSheet(ids){
  openSheet(`<h3>Přidat ${ids.length} do seznamu</h3>
  <div class="row" style="margin-bottom:12px"><input type="text" id="nlName" placeholder="Nový seznam, např. Test pátek"><button class="btn primary" id="nlGo" style="flex:none">Vytvořit</button></div>
  <div class="opt-list">${D.lists.map(l=>`<button data-l="${l.id}"><span>${l.emoji||'📁'}</span><span>${esc(l.name)}</span></button>`).join('')}</div>`,r=>{
    const add=lid=>{D.words.forEach(w=>{if(ids.includes(w.id)&&!w.lists.includes(lid))w.lists.push(lid)});save();closeSheet();dict.sel=false;dict.picked.clear();toast(`Přidáno do „${listById(lid).name}“`);renderDict()};
    $$('[data-l]',r).forEach(b=>b.onclick=()=>add(b.dataset.l));
    $('#nlGo',r).onclick=()=>{const n=$('#nlName').value.trim();if(!n)return toast('Napiš název seznamu');const l={id:uid(),name:n,emoji:'📝'};D.lists.push(l);add(l.id)};
  });
}
function listChipsHTML(sel){return `<div class="lchips" id="lchips">${D.lists.map(l=>`<button type="button" data-l="${l.id}" class="${sel.includes(l.id)?'on':''}">${l.emoji||'📁'} ${esc(l.name)}</button>`).join('')}</div>`}
function bindListChips(r){$$('#lchips button',r).forEach(b=>b.onclick=()=>b.classList.toggle('on'))}
const chosenLists=r=>$$('#lchips button.on',r).map(b=>b.dataset.l);
function wordForm(w){return `
  <div class="lbl">Španělsky</div><input type="text" id="eEs" value="${esc(w?.es)}" placeholder="např. el perro" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div class="lbl">Česky</div><input type="text" id="eCz" value="${esc(w?.cz)}" placeholder="např. pes" autocomplete="off" spellcheck="false">

  <div class="sub">Víc významů odděl čárkou (dům, domov). Text v závorce je jen nápověda a při psaní se nekontroluje.</div>

function bindWordForm(r){let last=$('#eEs',r);['#eEs','#eCz','#eNote'].forEach(s=>$(s,r).addEventListener('focus',e=>last=e.target));bindCharbar(r,()=>last);bindListChips(r)}
function addSheet(){
  openSheet(`<h3>Nové slovíčko</h3>${wordForm(null)}
  <div class="t-actions" style="margin-top:18px"><button class="btn" id="aMore">Uložit a další</button><button class="btn primary" id="aSave">Uložit</button></div>
  <button class="btn ghost block" id="aBulk">Přidat víc najednou (vložit seznam)</button>`,r=>{
    bindWordForm(r);
    const save1=()=>{const es=$('#eEs').value.trim(),cz=$('#eCz').value.trim();if(!es||!cz){toast('Vyplň španělsky i česky');return false}
      const ex=D.words.find(w=>w.es.toLowerCase()===es.toLowerCase());
      if(ex&&!confirm(`„${ex.es}“ už ve slovníku je (${ex.cz}). Přidat i tak?`))return false;
      D.words.push(newWord(es,cz,$('#eNote').value,chosenLists(r)));save();toast('Uloženo ✓');return true};
    $('#aSave').onclick=()=>{if(save1()){closeSheet();renderCurrent()}};
    $('#aMore').onclick=()=>{if(save1()){$('#eEs').value='';$('#eCz').value='';$('#eNote').value='';$('#eEs').focus();renderWordList()}};
    $('#aBulk').onclick=()=>bulkSheet(dict.filter.startsWith('l:')?dict.filter.slice(2):'');
  });
}
function editSheet(id){
  const w=D.words.find(x=>x.id===id);if(!w)return;
  const n=w.c+w.a+w.w,st={known:'✅ Umím',unsure:'🤔 Nejisté',weak:'❌ Neumím',new:'🆕 Nové'}[status(w)];
  openSheet(`<div class="row" style="align-items:center"><h3 style="flex:1;margin:4px 0">Upravit slovíčko</h3><button class="star ${w.star?'on':''}" id="eStar" style="flex:none;font-size:1.6rem">★</button><button class="icon-btn" id="eSpk" style="flex:none">🔊</button></div>
  ${wordForm(w)}
  <div class="wstats"><span class="pill">${st}</span><span class="pill good">✓ ${w.c}</span><span class="pill warn">≈ ${w.a}</span><span class="pill bad">✗ ${w.w}</span>${n?`<span class="pill">${Math.round((w.c+.5*w.a)/n*100)} %</span>`:''}</div>
  <div class="t-actions" style="margin-top:18px"><button class="btn danger" id="eDel">Smazat</button><button class="btn primary" id="eSave">Uložit</button></div>
  ${n?'<button class="btn ghost block" id="eReset">Vynulovat statistiku slovíčka</button>':''}`,r=>{
    bindWordForm(r);
    $('#eStar').onclick=e=>{w.star=!w.star;e.target.classList.toggle('on',w.star);save()};
    $('#eSpk').onclick=()=>speak($('#eEs').value||w.es);
    $('#eSave').onclick=()=>{const es=$('#eEs').value.trim(),cz=$('#eCz').value.trim();if(!es||!cz)return toast('Vyplň španělsky i česky');Object.assign(w,{es,cz,note:$('#eNote').value.trim(),lists:chosenLists(r)});save();closeSheet();toast('Uloženo ✓');renderCurrent()};
    $('#eDel').onclick=()=>{if(!confirm(`Smazat „${w.es}“?`))return;D.words=D.words.filter(x=>x!==w);save();closeSheet();toast('Smazáno');renderCurrent()};
    if($('#eReset'))$('#eReset').onclick=()=>{Object.assign(w,{c:0,a:0,w:0,box:0,due:0,recent:[],last:null});save();closeSheet();toast('Statistika vynulována');renderCurrent()};
  });
}
function parseBulk(txt){
  const out=[];
  txt.split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    let m=line.match(/^(.+?)\s*(?:\t|\s[-–—]\s|\s*=\s*|\s*;\s*|\s*:\s+)\s*(.+)$/);
    if(!m)m=line.match(/^(.+?)\s*[-–—]\s*(.+)$/);
    if(m&&m[1].trim()&&m[2].trim())out.push([m[1].trim(),m[2].trim()]);
  });
  return out;
}
function bulkSheet(preList='',newMode=false){
  openSheet(`<h3>${newMode?'Nový seznam':'Přidat víc slovíček'}</h3>
  ${newMode?`<div class="lbl">Název seznamu</div><div class="row"><input type="text" id="bEmoji" value="📝" style="flex:0 0 64px;text-align:center" maxlength="4"><input type="text" id="bName" placeholder="např. Slovíčka na test"></div>`
  :`<div class="lbl">Do seznamu</div><select id="bList"><option value="">Bez seznamu</option>${D.lists.map(l=>`<option value="${l.id}" ${l.id===preList?'selected':''}>${l.emoji||'📁'} ${esc(l.name)}</option>`).join('')}</select>`}
  <div class="lbl">Slovíčka – každé na nový řádek</div>
  <textarea id="bTxt" placeholder="el perro - pes&#10;la casa - dům, domov&#10;hablar = mluvit" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
  ${charbarHTML()}
  <div class="sub" id="bPrev">Formát: španělsky - česky. Oddělovač může být i =, ; nebo tabulátor (kopie z Excelu).${newMode?' Seznam můžeš vytvořit i prázdný a slova do něj přidat později.':''}</div>
  <button class="btn primary big" id="bGo">${newMode?'Vytvořit seznam':'Přidat slovíčka'}</button>`,r=>{
    const ta=$('#bTxt');bindCharbar(r,()=>ta);
    ta.oninput=()=>{const n=parseBulk(ta.value).length;$('#bPrev').textContent=n?`Rozpoznáno ${n} ${plural(n,'slovíčko','slovíčka','slovíček')}`:'Formát: španělsky - česky'};
    $('#bGo').onclick=()=>{
      let lid='';
      if(newMode){const name=$('#bName').value.trim();if(!name)return toast('Napiš název seznamu');const l={id:uid(),name,emoji:$('#bEmoji').value.trim()||'📝'};D.lists.push(l);lid=l.id}
      else lid=$('#bList').value;
      const pairs=parseBulk(ta.value);
      if(!newMode&&!pairs.length)return toast('Nic nerozpoznáno – zkontroluj formát');
      let added=0,linked=0;
      pairs.forEach(([es,cz])=>{const ex=D.words.find(w=>w.es.toLowerCase()===es.toLowerCase()&&fold(w.cz)===fold(cz))||D.words.find(w=>w.es.toLowerCase()===es.toLowerCase());
        if(ex){if(lid&&!ex.lists.includes(lid)){ex.lists.push(lid);linked++}}else{D.words.push(newWord(es,cz,'',lid?[lid]:[]));added++}});
      save();closeSheet();
      toast(newMode&&!pairs.length?'Seznam vytvořen':`Přidáno ${added} nových${linked?`, ${linked} existujících přiřazeno`:''}`);
      if(newMode){dict.tab='lists'}
      renderCurrent();
    };
  });
}
function renderListsTab(){

    return `<div class="lcard"><div class="lemoji">${l.emoji||'📁'}</div>
    <button class="lbody" data-open="${l.id}"><span class="lname">${esc(l.name)}</span><span class="lmeta">${ws.length} ${plural(ws.length,'slovíčko','slovíčka','slovíček')} · umím ${c.known}</span>
    <span class="mbar"><i style="width:${c.known/n*100}%;background:var(--good)"></i><i style="width:${c.unsure/n*100}%;background:var(--warn)"></i><i style="width:${c.weak/n*100}%;background:var(--bad)"></i></span></button>
    <button class="lplay" data-play="${l.id}" aria-label="Procvičit">▶</button><button class="lmore" data-more="${l.id}" aria-label="Možnosti">⋯</button></div>`};

  <div class="gtitle">Témata</div>${themes.map(card).join('')}`;
  $('#newList').onclick=()=>bulkSheet('',true);
  $$('[data-open]').forEach(b=>b.onclick=()=>{dict.tab='words';dict.filter='l:'+b.dataset.open;dict.q='';renderDict()});
  $$('[data-play]').forEach(b=>b.onclick=()=>startSession({src:'list:'+b.dataset.play}));
  $$('[data-more]').forEach(b=>b.onclick=()=>listSheet(b.dataset.more));
}
function listSheet(id){
  const l=listById(id);if(!l)return;
  openSheet(`<h3>${l.emoji||'📁'} ${esc(l.name)}</h3>
  <div class="lbl">Název</div><div class="row"><input type="text" id="lEmoji" value="${esc(l.emoji||'📁')}" style="flex:0 0 64px;text-align:center" maxlength="4"><input type="text" id="lName" value="${esc(l.name)}"></div>
  <button class="btn primary block" id="lSave">Uložit název</button>
  <button class="btn block" id="lBulk">+ Vložit slovíčka do seznamu</button>
  <button class="btn block" id="lShow">Zobrazit slovíčka</button>
  <button class="btn block" id="lReset">Vynulovat statistiku seznamu</button>
  <button class="btn danger block" id="lDel">Smazat seznam</button>`,r=>{
    $('#lSave').onclick=()=>{const n=$('#lName').value.trim();if(!n)return;l.name=n;l.emoji=$('#lEmoji').value.trim()||'📁';save();closeSheet();renderDict()};
    $('#lBulk').onclick=()=>bulkSheet(id);
    $('#lShow').onclick=()=>{closeSheet();dict.tab='words';dict.filter='l:'+id;renderDict()};
    $('#lReset').onclick=()=>{if(!confirm('Vynulovat statistiku všech slovíček v seznamu?'))return;D.words.forEach(w=>{if(w.lists.includes(id))Object.assign(w,{c:0,a:0,w:0,box:0,due:0,recent:[],last:null})});save();closeSheet();toast('Vynulováno');renderDict()};
    $('#lDel').onclick=()=>{if(!confirm(`Smazat seznam „${l.name}“?`))return;
      const alsoWords=confirm('Smazat i slovíčka, která nejsou v žádném jiném seznamu?\n\nOK = smazat i je, Zrušit = ponechat je ve slovníku');
      const was=new Set(D.words.filter(w=>w.lists.includes(id)).map(w=>w.id));
      D.words.forEach(w=>w.lists=w.lists.filter(x=>x!==id));
      if(alsoWords)D.words=D.words.filter(w=>w.lists.length||!was.has(w.id));
      D.lists=D.lists.filter(x=>x!==l);if(D.settings.source==='list:'+id)D.settings.source='all';save();closeSheet();toast('Seznam smazán');renderDict()};
  });
}

function renderStats(){
  const W=D.words,cs=countStatus(W),n=W.length||1;
  const tot=Object.values(D.days).reduce((a,d)=>({c:a.c+d.c,a:a.a+d.a,w:a.w+d.w}),{c:0,a:0,w:0}),T=tot.c+tot.a+tot.w;
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d),x=D.days[k]||{c:0,a:0,w:0};days.push({d,x,s:x.c+x.a+x.w,today:i===0})}
  const max=Math.max(5,...days.map(d=>d.s)),DN=['Ne','Po','Út','St','Čt','Pá','So'];
  const accW=w=>{const t=w.c+w.a+w.w;return t?Math.round((w.c+.5*w.a)/t*100):0};
  const grp=(st,title,emoji,sortFn)=>{const ws=W.filter(w=>status(w)===st).sort(sortFn);return `<details class="grp"><summary>${emoji} ${title}<span class="n">${ws.length}</span></summary><div class="grp-body">
    ${ws.length?`${ws.slice(0,60).map(w=>`<div class="mini"><span><b>${esc(w.es)}</b> <span class="muted">– ${esc(w.cz)}</span></span><span>${w.c}✓ ${w.w}✗</span></div>`).join('')}${ws.length>60?`<div class="sub" style="padding-top:8px">…a ${ws.length-60} dalších</div>`:''}<button class="btn primary block" data-prac="${st}">▶ Procvičit (${ws.length})</button>`:'<div class="sub">Zatím prázdné.</div>'}</div></details>`};
  const top=W.filter(w=>w.w>0).sort((a,b)=>b.w-a.w||accW(a)-accW(b)).slice(0,8);
  const MODE={cards:'🃏 Kartičky',type:'⌨️ Psaní',choice:'🔘 Výběr',gram:''};
  $('#view-stats').innerHTML=`<header class="top"><h1>Statistiky</h1></header>
  <div class="grid2">
    <div class="kpi"><b>${T}</b><span>odpovědí celkem</span></div>
    <div class="kpi"><b>${T?Math.round((tot.c+.5*tot.a)/T*100):0} %</b><span>úspěšnost</span></div>
    <div class="kpi"><b>🔥 ${streak()}</b><span>${plural(streak(),'den','dny','dní')} v řadě</span></div>
    <div class="kpi"><b>${D.sessions.length}</b><span>odehraných kol</span></div>
  </div>
  <div class="card"><h2>Posledních 14 dní</h2><div class="sub">správně ${tot.c} · skoro ${tot.a} · špatně ${tot.w}</div>
    <div class="chart">${days.map(d=>`<div class="col ${d.today?'today':''}"><div class="colbar"><div class="stack" style="height:${d.s/max*100}%" title="${d.s}">${d.s?`<i style="flex:${d.x.c};background:var(--good)"></i><i style="flex:${d.x.a};background:var(--warn)"></i><i style="flex:${d.x.w};background:var(--bad)"></i>`:''}</div></div><small>${DN[d.d.getDay()]}</small></div>`).join('')}</div>
  </div>
  <div class="card"><h2>Stav slovní zásoby</h2>
    <div class="bigbar"><i style="width:${cs.known/n*100}%;background:var(--good)"></i><i style="width:${cs.unsure/n*100}%;background:var(--warn)"></i><i style="width:${cs.weak/n*100}%;background:var(--bad)"></i></div>
    <div class="legend2"><span style="--c:var(--good)">Umím ${cs.known}</span><span style="--c:var(--warn)">Nejistá ${cs.unsure}</span><span style="--c:var(--bad)">Neumím ${cs.weak}</span><span style="--c:var(--surface2)">Nová ${cs.new}</span></div>
  </div>
  ${grp('weak','Neumím','❌',(a,b)=>b.w-a.w)}
  ${grp('unsure','Nejistá','🤔',(a,b)=>accW(a)-accW(b))}
  ${grp('known','Umím','✅',(a,b)=>b.c-a.c)}
  ${top.length?`<div class="card"><h2>Nejčastější chyby</h2>${top.map(w=>`<div class="mini"><span><b>${esc(w.es)}</b> <span class="muted">– ${esc(w.cz)}</span></span><span>${w.w}× špatně</span></div>`).join('')}<button class="btn block" id="topPrac" style="margin-top:10px">▶ Procvičit tyto</button></div>`:''}
  ${D.sessions.length?`<div class="card"><h2>Poslední kola</h2>${D.sessions.slice(0,10).map(s=>{const t=s.c+s.a+s.w;return `<div class="sess"><span>${new Date(s.t).toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'})} ${new Date(s.t).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'})} · ${MODE[s.mode]||''}${s.label?esc(s.label):''}${s.retry?' · chyby':''}</span><b>${s.c}/${t} ${t?`(${Math.round((s.c+.5*s.a)/t*100)} %)`:''}</b></div>`}).join('')}</div>`:''}`;
  $$('[data-prac]').forEach(b=>b.onclick=()=>startSession({src:b.dataset.prac,len:0}));
  if($('#topPrac'))$('#topPrac').onclick=()=>startSession({words:top,len:0});
}

async function exportData(){
  saveNow();
  const json=JSON.stringify(D),name=`spanelsky-slovnik-${dkey()}.json`;
  try{const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Záloha slovníku'});return}}
  catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Záloha stažena');
}
$('#importFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.words)||!Array.isArray(d.lists))throw 0;
    if(!confirm(`Záloha obsahuje ${d.words.length} slovíček. Nahradit současná data?`))return;

volver:vuelvo,vuelves,vuelve,volvemos,volvéis,vuelven
pedir:pido,pides,pide,pedimos,pedís,piden
entender:entiendo,entiendes,entiende,entendemos,entendéis,entienden

oír:oigo,oyes,oye,oímos,oís,oyen

`ser:fui,fuiste,fue,fuimos,fuisteis,fueron
ir:fui,fuiste,fue,fuimos,fuisteis,fueron
estar:estuve,estuviste,estuvo,estuvimos,estuvisteis,estuvieron
tener:tuve,tuviste,tuvo,tuvimos,tuvisteis,tuvieron
hacer:hice,hiciste,hizo,hicimos,hicisteis,hicieron
poder:pude,pudiste,pudo,pudimos,pudisteis,pudieron
poner:puse,pusiste,puso,pusimos,pusisteis,pusieron
venir:vine,viniste,vino,vinimos,vinisteis,vinieron
decir:dije,dijiste,dijo,dijimos,dijisteis,dijeron
querer:quise,quisiste,quiso,quisimos,quisisteis,quisieron

dar:di,diste,dio,dimos,disteis,dieron
ver:vi,viste,vio,vimos,visteis,vieron
traer:traje,trajiste,trajo,trajimos,trajisteis,trajeron
leer:leí,leíste,leyó,leímos,leísteis,leyeron
dormir:dormí,dormiste,durmió,dormimos,dormisteis,durmieron
pedir:pedí,pediste,pidió,pedimos,pedisteis,pidieron
llegar:llegué,llegaste,llegó,llegamos,llegasteis,llegaron
buscar:busqué,buscaste,buscó,buscamos,buscasteis,buscaron
empezar:empecé,empezaste,empezó,empezamos,empezasteis,empezaron
jugar:jugué,jugaste,jugó,jugamos,jugasteis,jugaron
pagar:pagué,pagaste,pagó,pagamos,pagasteis,pagaron`.split('\n').forEach(l=>{const[v,f]=l.split(':');IRR.pret[v]=f.split(',')});
const REG_PRES='hablar trabajar estudiar escuchar mirar comprar llamar llegar tomar llevar esperar preguntar ayudar necesitar caminar nadar viajar cocinar limpiar usar cambiar bailar cantar ganar buscar pagar tocar terminar comer beber aprender vender correr responder creer leer comprender vivir escribir abrir recibir decidir subir'.split(' ');
const REG_PRET='hablar trabajar estudiar escuchar mirar comprar llamar tomar llevar esperar preguntar ayudar necesitar caminar nadar viajar cocinar limpiar usar cambiar bailar cantar ganar terminar comer beber aprender vender correr responder comprender vivir escribir abrir recibir decidir subir'.split(' ');
const ENDS={pres:{ar:['o','as','a','amos','áis','an'],er:['o','es','e','emos','éis','en'],ir:['o','es','e','imos','ís','en']},pret:{ar:['é','aste','ó','amos','asteis','aron'],er:['í','iste','ió','imos','isteis','ieron'],ir:['í','iste','ió','imos','isteis','ieron']}};
const FUT_STEM={tener:'tendr',venir:'vendr',poner:'pondr',salir:'saldr',poder:'podr',saber:'sabr',querer:'querr',hacer:'har',decir:'dir',oír:'oir'};
const PART_IRR={hacer:'hecho',decir:'dicho',ver:'visto',poner:'puesto',volver:'vuelto',escribir:'escrito',abrir:'abierto',romper:'roto',morir:'muerto',descubrir:'descubierto',leer:'leído',oír:'oído',traer:'traído',creer:'creído'};
const IMPF_IRR={ser:'era,eras,era,éramos,erais,eran',ir:'iba,ibas,iba,íbamos,ibais,iban',ver:'veía,veías,veía,veíamos,veíais,veían'};
const SUBJ_IRR={ser:'sea,seas,sea,seamos,seáis,sean',estar:'esté,estés,esté,estemos,estéis,estén',ir:'vaya,vayas,vaya,vayamos,vayáis,vayan',saber:'sepa,sepas,sepa,sepamos,sepáis,sepan',dar:'dé,des,dé,demos,deis,den'};
const SUBJ_STEM={tener:['teng','teng'],hacer:['hag','hag'],decir:['dig','dig'],venir:['veng','veng'],salir:['salg','salg'],poner:['pong','pong'],conocer:['conozc','conozc'],ver:['ve','ve'],oír:['oig','oig'],traer:['traig','traig'],poder:['pued','pod'],querer:['quier','quer'],dormir:['duerm','durm'],jugar:['juegu','jugu'],pensar:['piens','pens'],empezar:['empiec','empec'],volver:['vuelv','volv'],pedir:['pid','pid'],entender:['entiend','entend'],encontrar:['encuentr','encontr']};
const TENSES=[['pres','Přítomný'],['pret','Indefinido'],['impf','Imperfektum'],['perf','Perfektum'],['fut','Budoucí'],['cond','Podmiňovací'],['subj','Subjunktiv']];
const TNAME=Object.fromEntries(TENSES.map(([k,v])=>[k,v]));
const TLABEL={pres:'Přítomný čas',pret:'Minulý čas (indefinido)',impf:'Imperfektum',perf:'Minulý čas složený',fut:'Budoucí čas',cond:'Podmiňovací způsob',subj:'Subjunktiv přítomný'};
const participle=v=>PART_IRR[v]||(v.endsWith('ar')?v.slice(0,-2)+'ado':v.slice(0,-2)+'ido');
function conjugate(v,t){
  const st=v.slice(0,-2),g=v.slice(-2).replace('ír','ir');
  if(t==='pres'||t==='pret'){if(IRR[t][v])return IRR[t][v];return ENDS[t][g].map(e=>st+e)}
  if(t==='impf'){if(IMPF_IRR[v])return IMPF_IRR[v].split(',');return(g==='ar'?['aba','abas','aba','ábamos','abais','aban']:['ía','ías','ía','íamos','íais','ían']).map(e=>st+e)}
  if(t==='fut'||t==='cond'){const s=FUT_STEM[v]||v;return(t==='fut'?['é','ás','á','emos','éis','án']:['ía','ías','ía','íamos','íais','ían']).map(e=>s+e)}
  if(t==='perf'){const p=participle(v);return['he','has','ha','hemos','habéis','han'].map(h=>h+' '+p)}
  if(t==='subj'){
    if(SUBJ_IRR[v])return SUBJ_IRR[v].split(',');
    const E=g==='ar'?['e','es','e','emos','éis','en']:['a','as','a','amos','áis','an'];
    let s1,s2;
    if(SUBJ_STEM[v])[s1,s2]=SUBJ_STEM[v];
    else{s1=s2=v.endsWith('car')?st.slice(0,-1)+'qu':v.endsWith('gar')?st+'u':v.endsWith('zar')?st.slice(0,-1)+'c':st}
    return E.map((e,i)=>(i===3||i===4?s2:s1)+e);
  }
}
function tensePools(t){
  const irrP=Object.keys(IRR.pres),extra=['tener','hacer','poder','querer','decir','venir','salir','poner','saber','estar','dar','dormir','pedir','volver','pensar','jugar','empezar','entender','encontrar','conocer','traer'];
  switch(t){
    case 'pres':return{reg:REG_PRES,irr:irrP};
    case 'pret':return{reg:REG_PRET,irr:Object.keys(IRR.pret)};
    case 'impf':return{reg:[...REG_PRES,...extra],irr:Object.keys(IMPF_IRR)};
    case 'fut':case 'cond':return{reg:[...REG_PRES,'ser','estar','ir','dar','ver','dormir','pedir','volver','pensar','jugar','empezar'],irr:Object.keys(FUT_STEM)};
    case 'perf':return{reg:[...REG_PRES,...extra].filter(v=>!PART_IRR[v]),irr:Object.keys(PART_IRR)};
    case 'subj':return{reg:REG_PRES,irr:[...Object.keys(SUBJ_IRR),...Object.keys(SUBJ_STEM)]};
  }
}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function verbCz(v){const w=D.words.find(w=>w.es===v)||D.words.find(w=>w.es.startsWith(v+' ('));return w?w.cz:''}
function genConj(n=20){
  const s=D.settings,tenses=(s.conjTenses&&s.conjTenses.length)?s.conjTenses:['pres'],items=[],used=new Set();let guard=0;
  const persons=[0,1,2,3,4,5].filter(p=>s.vosotros||p!==4);
  while(items.length<n&&guard++<1500){
    const t=rnd(tenses),P=tensePools(t);
    const v=rnd(s.conjSet==='reg'?P.reg:s.conjSet==='irr'?P.irr:[...P.reg,...P.irr,...P.irr]),p=rnd(persons),k=v+t+p;
    if(used.has(k))continue;used.add(k);
    const forms=conjugate(v,t);
    items.push({kind:'conj',key:k,v,p,a:forms[p],cz:verbCz(v),label:TLABEL[t],plain:`${v} · ${PERS[p]} (${TNAME[t].toLowerCase()})`,
      note:forms.map((f,i)=>(s.vosotros||i!==4)?`<span class="${i===p?'hl':''}">${PERS[i].split(' ')[0]} <b>${f}</b></span>`:'').join('')});
  }
  return items;
}

/* --- běh cvičení --- */
function startGram(items,meta={}){
  if(!items.length)return toast('Žádná cvičení');
  S={mode:'gram',src:meta.src||'gram',dir:'',items:(meta.keepOrder?items:shuffle(items)).map(x=>({...x})),i:0,cnt:{c:0,a:0,w:0},results:[],undo:null,busy:false,t:Date.now(),retry:!!meta.retry,lid:meta.lid,label:meta.label,regen:meta.regen};
  $('#practice').hidden=false;document.body.classList.add('lock');updateScore();renderItem();
}
function renderGram(item){
  let card;
  if(item.kind==='conj')card=`<div class="tcard"><div class="lang">${item.label}</div><div class="word">${esc(item.v)}</div>${item.cz?`<div class="sub">${esc(item.cz)}</div>`:''}<div class="gperson">${esc(PERS[item.p])}</div></div>`;
  else card=`<div class="tcard"><div class="lang">${esc(item.label)}</div><div class="gqt">${esc(item.q).replace(/_{2,}/g,'<span class="blank"></span>')}</div></div>`;
  if(item.opts)choiceUI(item,card);
  else typingUI(item,{card,answer:item.a,placeholder:'Doplň…',gopts:{articles:false},note:item.note});
}
function choiceUI(item,card){
  $('#pBody').innerHTML=`${card}<div class="opts">${item.opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb" style="margin-top:12px"></div><button class="btn primary block" id="cNext" hidden>Další</button>`;
  $$('.opt').forEach(b=>b.onclick=()=>{
    if(S.busy)return;S.busy=true;const ok=b.dataset.v===item.a;
    $$('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===item.a)x.classList.add('good')});
    if(!ok)b.classList.add('bad');item.given=b.dataset.v;record(item,ok?'c':'w');
    $('#fb').innerHTML=`<span class="v ${ok?'good':'bad'}">${ok?'✓ Správně':'✗ Správně je: '+esc(item.a)}</span>${item.note?`<div class="gnote">${item.note}</div>`:''}`;
    $('#cNext').hidden=false;$('#cNext').onclick=()=>{S.i++;renderItem()};
  });
}

/* --- záložka a lekce --- */
const BOOK_ORDER=['U','L1','L2','L3','L4','L5','L6','L7','R1','L8','L9','L10','L11','L12','L13','L14','R2','L15','L16','L17','L18','L19','L20','L21','R3','X'];
const gOpen=new Set();
function bookTitle(k){if(k==='U')return 'Úvod · výslovnost a přízvuk';if(k==='X')return 'Navíc';const b=BOOK.find(x=>x[0]===k);return b?b[2]:k}
function renderGrammar(){
  const s=D.settings,done=LESSONS.filter(l=>D.gram[l.id]).length,tsel=new Set(s.conjTenses);
  const lcard=l=>{const g=D.gram[l.id],n=parseEx(l).length;return `<button class="gl" data-l="${l.id}"><span class="lemoji">${l.emoji}</span><span class="lbody2"><b>${l.title}</b><span>${l.intro}</span></span>${g?`<span class="badge ${g.best>=80?'ok':''}">${g.best} %</span>`:`<span class="badge">${n} cv.</span>`}</button>`};
  const sec=k=>{const ls=LESSONS.filter(l=>l.book===k),list=listById('k-'+k),nw=list?D.words.filter(w=>w.lists.includes(list.id)).length:0;
    if(!ls.length&&!list)return '';const dn=ls.filter(l=>D.gram[l.id]).length;
    return `<details class="grp" data-k="${k}" ${gOpen.has(k)?'open':''}><summary>${esc(bookTitle(k))}<span class="n">${ls.length?`${dn}/${ls.length}`:''}</span></summary><div class="grp-body">
      ${list?`<button class="gvoc" data-voc="${list.id}"><span>📗 Slovíčka lekce</span><span class="muted">${nw} ›</span></button>`:''}
      ${ls.map(lcard).join('')}</div></details>`};
  $('#view-gram').innerHTML=`<header class="top"><div><div class="sub">${done} z ${LESSONS.length} lekcí procvičeno</div><h1>Gramatika</h1></div></header>
  <div class="card"><h2>🔤 Trenažér časování</h2><div class="sub">Dostaneš sloveso a osobu, napíšeš správný tvar.</div>
    <div class="lbl">Časy (můžeš vybrat víc)</div><div class="lchips" id="tchips">${TENSES.map(([k,n])=>`<button type="button" data-t="${k}" class="${tsel.has(k)?'on':''}">${n}</button>`).join('')}</div>
    <div class="lbl">Slovesa</div>${segHTML('conjSet',[['reg','Pravidelná'],['irr','Nepravidelná'],['all','Vše']])}
    <div class="set-row" style="padding:16px 0 0;border:0"><div><div class="t">Včetně „vosotros“</div><div class="d">V Latinské Americe se nepoužívá</div></div>${sw('vosotros')}</div>
    <button class="btn primary big" id="conjGo">Začít časovat</button></div>
  <button class="qbtn" id="gMix" style="width:100%;margin-bottom:6px"><b>🎲 Gramatický mix</b><span>20 náhodných cvičení z lekcí, které máš procvičené (nebo ze všech)</span></button>
  <div class="gtitle">Podle učebnice</div>
  ${BOOK_ORDER.map(sec).join('')}`;
  bindSegs($('#view-gram'));
  $$('#tchips button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');s.conjTenses=$$('#tchips button.on').map(x=>x.dataset.t);if(!s.conjTenses.length){s.conjTenses=[b.dataset.t];b.classList.add('on')}save()});
  $$('#view-gram input[data-k]').forEach(i=>i.onchange=()=>{s[i.dataset.k]=i.checked;save()});
  $$('#view-gram details.grp').forEach(d=>d.addEventListener('toggle',()=>{d.open?gOpen.add(d.dataset.k):gOpen.delete(d.dataset.k)}));
  $('#conjGo').onclick=()=>{const regen=()=>startGram(genConj(20),{src:'conj',label:'🔤 Časování',regen,keepOrder:true});regen()};
  $('#gMix').onclick=()=>{const pool=LESSONS.filter(l=>D.gram[l.id]);const src=(pool.length>=2?pool:LESSONS);const regen=()=>startGram(shuffle(src.flatMap(parseEx)).slice(0,20),{src:'gmix',label:'🎲 Gramatický mix',regen});regen()};
  $$('.gl').forEach(b=>b.onclick=()=>openLesson(b.dataset.l));
  $$('[data-voc]').forEach(b=>b.onclick=()=>startSession({src:'list:'+b.dataset.voc}));
}
let curLesson=null;
function lessonFoot(){if(!curLesson)return;const g=D.gram[curLesson.id],n=parseEx(curLesson).length;$('#lGo').textContent=`Procvičit (${n} cvičení)${g?` · nejlépe ${g.best} %`:''}`}
function openLesson(id){
  const L=LESSONS.find(l=>l.id===id);if(!L)return;curLesson=L;
  $('#lTitle').textContent=L.emoji+' '+L.title;
  $('#lBody').innerHTML=`<div class="g"><span class="pill">${L.level}</span> <span class="pill">${esc(bookTitle(L.book).split(' · ')[0])}</span><p class="lead">${L.intro}</p>${L.html}</div>`;
  lessonFoot();$('#lesson').hidden=false;document.body.classList.add('lock');$('#lBody').scrollTop=0;
  $('#lGo').onclick=()=>{const regen=()=>startGram(parseEx(L),{src:'lesson:'+L.id,lid:L.id,label:L.emoji+' '+L.title,regen});regen()};
}
$('#lClose').onclick=()=>{$('#lesson').hidden=true;curLesson=null;document.body.classList.remove('lock');renderCurrent()};

$$('#tabbar button').forEach(b=>b.onclick=()=>{
